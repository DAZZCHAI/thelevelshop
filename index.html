<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="description" content="LEVEL SHOP — compra en línea, mayoreo y redes sociales oficiales." />
  <title>LEVEL SHOP | Sube de nivel</title>
  <link rel="icon" type="image/png" href="assets/level-logo.png" />
  <style>
    :root{
      --bg:#0A0A0A;
      --panel:#111111;
      --panel-2:#161616;
      --green:#C8FF3D;
      --white:#FFFFFF;
      --muted:#B8B8B8;
      --line:rgba(200,255,61,.32);
      --shadow:0 18px 60px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100svh;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--white);
      background:
        radial-gradient(circle at 50% -10%, rgba(200,255,61,.12), transparent 35%),
        linear-gradient(180deg,#080808 0%,#0A0A0A 45%,#070707 100%);
      display:flex;
      justify-content:center;
      padding:24px 16px calc(30px + env(safe-area-inset-bottom));
    }

    .page{
      width:min(100%,560px);
      position:relative;
    }

    .ambient{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      border-radius:32px;
      opacity:.5;
    }
    .ambient::before,
    .ambient::after{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      border-radius:999px;
      filter:blur(70px);
      background:rgba(200,255,61,.09);
    }
    .ambient::before{top:80px;left:-120px}
    .ambient::after{right:-140px;bottom:140px}

    main{
      position:relative;
      z-index:1;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(8,8,8,.72);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-radius:30px;
      padding:34px 22px 28px;
      box-shadow:var(--shadow);
    }

    .brand{
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .logo-wrap{
      width:154px;
      height:154px;
      border-radius:50%;
      padding:6px;
      background:linear-gradient(145deg,var(--green),#5e7b14 65%,#1b1b1b);
      box-shadow:0 0 0 7px rgba(200,255,61,.07),0 18px 40px rgba(0,0,0,.45);
      position:relative;
    }
    .logo-wrap::after{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:50%;
      box-shadow:0 0 34px rgba(200,255,61,.16);
      pointer-events:none;
    }
    .logo-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      display:block;
      background:#000;
    }

    h1{
      margin:22px 0 6px;
      font-size:clamp(2rem,8vw,3rem);
      line-height:.95;
      letter-spacing:-.055em;
      font-weight:900;
    }
    h1 span{color:var(--green)}

    .tagline{
      margin:10px auto 0;
      color:#EDEDED;
      font-size:1rem;
      line-height:1.55;
      max-width:410px;
    }
    .tagline strong{
      color:var(--green);
      font-weight:800;
    }

    .divider{
      height:3px;
      width:80px;
      border-radius:999px;
      background:var(--green);
      margin:22px auto 0;
      box-shadow:0 0 16px rgba(200,255,61,.28);
    }

    .links{
      display:grid;
      gap:14px;
      margin-top:30px;
    }

    .btn{
      min-height:76px;
      width:100%;
      border-radius:18px;
      text-decoration:none;
      display:grid;
      grid-template-columns:46px 1fr 36px;
      align-items:center;
      gap:10px;
      padding:14px 16px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
      color:var(--white);
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease;
      box-shadow:0 10px 30px rgba(0,0,0,.24);
    }
    .btn:hover,
    .btn:focus-visible{
      transform:translateY(-2px);
      border-color:rgba(200,255,61,.75);
      box-shadow:0 14px 38px rgba(0,0,0,.34),0 0 0 4px rgba(200,255,61,.06);
      outline:none;
    }
    .btn.primary{
      background:var(--green);
      color:#080808;
      border-color:var(--green);
    }
    .btn.primary:hover,
    .btn.primary:focus-visible{
      box-shadow:0 18px 45px rgba(200,255,61,.16),0 0 0 4px rgba(200,255,61,.08);
    }

    .iconbox{
      width:42px;
      height:42px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:rgba(0,0,0,.14);
    }
    .btn:not(.primary) .iconbox{background:rgba(200,255,61,.08);color:var(--green)}
    .btn svg{width:23px;height:23px;display:block}

    .btn-copy{text-align:left;min-width:0}
    .btn-title{
      display:block;
      font-weight:900;
      font-size:1.03rem;
      letter-spacing:.01em;
    }
    .btn-sub{
      display:block;
      margin-top:3px;
      opacity:.72;
      font-size:.8rem;
      font-weight:600;
    }
    .arrow{
      font-size:1.45rem;
      font-weight:500;
      text-align:center;
      line-height:1;
    }

    .social-title{
      margin:30px 0 14px;
      text-align:center;
      color:var(--muted);
      font-size:.78rem;
      text-transform:uppercase;
      letter-spacing:.18em;
      font-weight:800;
    }

    .socials{
      display:flex;
      justify-content:center;
      gap:13px;
      flex-wrap:wrap;
    }
    .social{
      width:58px;
      height:58px;
      border-radius:18px;
      display:grid;
      place-items:center;
      color:var(--green);
      background:var(--panel-2);
      border:1px solid rgba(255,255,255,.07);
      text-decoration:none;
      transition:.18s ease;
    }
    .social:hover,
    .social:focus-visible{
      transform:translateY(-2px) scale(1.02);
      border-color:rgba(200,255,61,.5);
      box-shadow:0 10px 28px rgba(0,0,0,.35);
      outline:none;
    }
    .social svg{width:25px;height:25px;display:block}

    footer{
      text-align:center;
      margin-top:27px;
      color:#777;
      font-size:.76rem;
      letter-spacing:.02em;
    }
    footer b{color:#aaa}

    @media (max-width:420px){
      body{padding-left:12px;padding-right:12px}
      main{padding:28px 16px 24px;border-radius:25px}
      .logo-wrap{width:136px;height:136px}
      .btn{grid-template-columns:42px 1fr 30px;min-height:72px;padding:12px 13px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
<body>

    </main>
  </div>
</body>
</html>
